<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="t">
  <title id="t">Session closed — thanks for stopping by</title>
  <defs>
    <clipPath id="frame"><rect width="1000" height="180" rx="16"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .blinkf{animation:blinkf 1.1s steps(1) infinite}
    @keyframes blinkf{50%{fill-opacity:0}}
    .c{animation:bob 2.4s ease-in-out infinite alternate}
    @keyframes bob{from{transform:translateY(3px)}to{transform:translateY(-3px)}}
  </style>
  <g clip-path="url(#frame)" class="mono">
    <rect width="1000" height="180" fill="#0A0E14"/>
    <rect width="1000" height="40" fill="#0F141C"/>
    <line x1="0" y1="40" x2="1000" y2="40" stroke="#1F2937"/>
    <circle cx="24" cy="20" r="6" fill="#FF5F56"/>
    <circle cx="44" cy="20" r="6" fill="#FFBD2E"/>
    <circle cx="64" cy="20" r="6" fill="#27C93F"/>
    <text x="500" y="25" text-anchor="middle" font-size="12" letter-spacing="1" fill="#6E7681">session — VED.TERMINAL</text>

    <text x="32" y="80" font-size="15"><tspan fill="#00FF9C" font-weight="700">ved@terminal</tspan><tspan fill="#6E7681">:~$ </tspan><tspan fill="#E6EDF3">exit</tspan></text>
    <text x="32" y="122" font-size="24" font-weight="800" letter-spacing="1" fill="#FFB000">SESSION CLOSED · THANKS FOR STOPPING BY ★</text>
    <text x="32" y="154" font-size="14" fill="#6E7681">ledgers balanced  ·  positions open  ·  <tspan fill="#00FF9C">[process exited with code 0]</tspan><tspan class="blinkf" fill="#FFB000"> █</tspan></text>

    <g stroke-width="1.5">
      <g class="c" style="animation-delay:0s"><line x1="840" y1="92" x2="840" y2="140" stroke="#00FF9C"/><rect x="834" y="104" width="12" height="26" fill="#00FF9C"/></g>
      <g class="c" style="animation-delay:.3s"><line x1="864" y1="86" x2="864" y2="126" stroke="#FF3B5C"/><rect x="858" y="98" width="12" height="14" fill="#FF3B5C"/></g>
      <g class="c" style="animation-delay:.6s"><line x1="888" y1="74" x2="888" y2="120" stroke="#00FF9C"/><rect x="882" y="82" width="12" height="28" fill="#00FF9C"/></g>
      <g class="c" style="animation-delay:.9s"><line x1="912" y1="62" x2="912" y2="100" stroke="#00FF9C"/><rect x="906" y="68" width="12" height="22" fill="#00FF9C"/></g>
      <g class="c" style="animation-delay:1.2s"><line x1="936" y1="52" x2="936" y2="86" stroke="#00FF9C"/><rect x="930" y="56" width="12" height="20" fill="#00FF9C"/></g>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="179" rx="16" fill="none" stroke="#1F2937"/>
</svg>
